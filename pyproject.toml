[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-nav-station"
version = "2.0.0"
description = "Visual navigation ground station for Firefly devices"
requires-python = ">=3.8"
dependencies = [
  "PyQt5>=5.15,<6",
  "opencv-python>=4.5,<5",
  "PyYAML>=6.0",
  "paramiko>=3.4",
  "rasterio>=1.3,<2",
]

[project.scripts]
nav-station = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 120
